backend = "gix";
vsync = true;

shadow = true;
shadow-radius = 12;
shadow-opacity = 0.7;

corner-radius = 8;
blur-background = true;

animations = (
	{
		triggers = [ "open", "show" ];
		preset = "appear";
		duration = 0.18;
		scale = 0.96;
	},
)   {
		triggers = [ "close", "hide" ];
		preset = "disappear";
		duration = 0.15;
		scale = 0.96;
	}
};
