# Network boot (PXE) hooks removed: AuricOS boots from USB or DVD only, and those
# hooks packed network drivers and firmware into the initramfs.
HOOKS=(base udev microcode modconf memdisk archiso archiso_loop_mnt block filesystems keyboard)
COMPRESSION="xz"
COMPRESSION_OPTIONS=(-9e)
# Store modules uncompressed inside the image so xz can compress them together
# (already-compressed modules barely shrink further).
MODULES_DECOMPRESS="yes"
