---
defaultGroups: [ users, lp, video, network, storage, wheel, audio ]
autologinGroup: autologin
doAutologin: false
sudoersGroup: wheel
setRootPassword: false
doReusePassword: false
allowWeakPasswords: false
passwordRequirements:
  nonempty: true
  minLength: 8
  maxlength: -1
hostname:
  location: EtcFile
  writeHostsFile: true
  template: "auricos"
