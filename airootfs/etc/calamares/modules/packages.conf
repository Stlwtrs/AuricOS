# Installs the optional software chosen on the netinstall page.
# Runs after the cleanup stage, so the pacman keyring is ready and the
# build-time local repository has been removed: packages come from the
# public Arch Linux mirrors only.
---
backend: pacman

# Offline installs still succeed; the optional software is skipped.
skip_if_no_internet: true

# A fresh install has no package databases yet.
update_db: true
update_system: false

pacman:
    num_retries: 3
    disable_download_timeout: false
    needed_only: true
