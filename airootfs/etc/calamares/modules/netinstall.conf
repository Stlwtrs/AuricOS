# Optional software page. Groups selected here are downloaded from the
# Arch Linux mirrors and installed by the packages module (packages.conf).
# They are not on the ISO, which keeps it under GitHub's 2 GiB file limit.
---
groupsUrl: local
required: false
label:
    sidebar: "Software"
    title: "Optional software (downloaded during installation)"

groups:
  - name: "Penetration testing tools"
    description: "Metasploit, Wireshark, hashcat, John the Ripper, Hydra, sqlmap, gobuster, Impacket, pwntools, GDB and smbclient. Needs an internet connection; skipped if you're offline."
    selected: true
    critical: false
    expanded: false
    packages:
      - metasploit
      - wireshark-qt
      - hashcat
      - john
      - hydra
      - sqlmap
      - gobuster
      - impacket
      - python-pwntools
      - gdb
      - smbclient

  - name: "Tor Browser"
    description: "Browses through the Tor network. Installs the launcher, which downloads and verifies Tor Browser the first time you open it. Needs an internet connection."
    selected: true
    critical: false
    expanded: false
    packages:
      - torbrowser-launcher
