---
dontChroot: false
timeout: 300
script:
  - "rm -f /etc/mkinitcpio.conf.d/archiso.conf"
  - "rm -f /etc/systemd/system/getty@tty1.service.d/autologin.conf"
  - "rmdir --ignore-fail-on-non-empty /etc/systemd/system/getty@tty1.service.d"
  - "rm -f /root/.automated_script.sh /root/.zlogin"
  - "rm -f /etc/systemd/system/multi-user.target.wants/auric-firstboot.service /etc/systemd/system/auric-firstboot.service /usr/local/bin/auric-firstboot"
  - "rm -f /etc/systemd/system/multi-user.target.wants/pacman-init.service /etc/systemd/system/pacman-init.service /etc/systemd/system/etc-pacman.d-gnupg.mount"
  - "rm -f /etc/systemd/system/multi-user.target.wants/choose-mirror.service /etc/systemd/system/multi-user.target.wants/livecd-talk.service /etc/systemd/system/livecd-talk.service"
  - "rm -f /etc/systemd/system/multi-user.target.wants/gdm.service"
  - "rm -f /etc/systemd/system/multi-user.target.wants/sshd.service /etc/ssh/sshd_config.d/10-archiso.conf"
  - 'sed -i "/^\[auricos-repo\]/,/^$/d" /etc/pacman.conf'
  - "rm -rf /opt/auricos-repo"
  - "passwd -l root"
  - "pacman-key --init"
  - "pacman-key --populate"
  - "cp /usr/share/auricos/xfce4-panel-installed.xml /etc/skel/.config/xfce4/xfconf/xfce-perchannel-xml/xfce4-panel.xml"
  - "rm -rf /usr/share/auricos/xfce4-panel-installed.xml"
  - "rm -f /usr/share/applications/auricos-installer.desktop"
  - "pacman -Rns --noconfirm calamares"
  - "rm -rf /etc/calamares"
  - "sed -i 's/^ENABLED=no/ENABLED=yes/' /etc/ufw/ufw.conf"
  - "systemctl enable ufw.service apparmor.service auditd.service"
