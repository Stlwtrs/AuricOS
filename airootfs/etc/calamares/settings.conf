---
modules-search: [ local ]

instances:
  - id: kernel
    module: shellprocess
    config: shellprocess_kernel.conf
  - id: cleanup
    module: shellprocess
    config: shellprocess_cleanup.conf
  - id: lockroot
    module: shellprocess
    config: shellprocess_lockroot.conf

sequence:
  - show:
    - welcome
    - locale
    - keyboard
    - partition
    - users
    - summary
  - exec:
    - partition
    - mount
    - unpackfs
    - shellprocess@kernel
    - shellprocess@cleanup
    - machineid
    - fstab
    - locale
    - keyboard
    - localecfg
    - users
    - shellprocess@lockroot
    - networkcfg
    - hwclock
    - initcpiocfg
    - initcpio
    - grubcfg
    - bootloader
    - umount
  - show:
    - finished

branding: auricos
prompt-install: true
dont-chroot: false
disable-cancel-during-exec: true
