LABEL arch_nbd
TEXT HELP
Boot the AuricOS live system using NBD.
It allows you to try AuricOS, install it, or perform system maintenance.
ENDTEXT
MENU LABEL AuricOS live (%ARCH%, NBD)
LINUX ::/%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-cachyos-bore
INITRD ::/%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-cachyos-bore.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% archiso_nbd_srv=${pxeserver} cms_verify=y %KERNEL_PARAMS%
SYSAPPEND 3

