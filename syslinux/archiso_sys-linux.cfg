LABEL arch
TEXT HELP
Boot the AuricOS live system on BIOS.
It allows you to try AuricOS, install it, or perform system maintenance.
ENDTEXT
MENU LABEL AuricOS live (%ARCH%, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-cachyos-bore
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-cachyos-bore.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% %KERNEL_PARAMS%

# Accessibility boot option
LABEL archspeech
TEXT HELP
Boot the AuricOS live system on BIOS with speakup screen reader.
It allows you to try AuricOS, install it, or perform system maintenance with speech feedback.
ENDTEXT
MENU LABEL AuricOS live (%ARCH%, BIOS) with ^speech
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-cachyos-bore
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-cachyos-bore.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% accessibility=on %KERNEL_PARAMS%
