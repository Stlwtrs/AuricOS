name: Feature or hardening suggestion
description: Suggest a new feature or a security improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to see?
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: Why?
      description: For hardening suggestions, describe the threat it addresses and any Lynis test ID or benchmark it relates to.
    validations:
      required: true
  - type: textarea
    id: tradeoffs
    attributes:
      label: Trade-offs
      description: Could this break anything for a desktop user (devices, browsers, updates, usability)?
