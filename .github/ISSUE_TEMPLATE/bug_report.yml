name: Bug report
description: Report something that doesn't work in the live ISO, installer, or installed system
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. **For security vulnerabilities, do not use this form.** Follow SECURITY.md instead.
  - type: dropdown
    id: where
    attributes:
      label: Where does the problem happen?
      options:
        - Live session
        - Installer (Calamares)
        - Installed system
        - ISO build
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: AuricOS version or commit
      placeholder: "1.0-beta, or a commit hash"
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Virtual machine (QEMU/KVM)
        - Virtual machine (VirtualBox, VMware, other)
        - Physical hardware
    validations:
      required: true
  - type: dropdown
    id: firmware
    attributes:
      label: Boot mode
      options:
        - BIOS
        - UEFI
        - Not sure
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: What you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Boot the ISO
        2. ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or output
      description: For installer issues, include the Calamares log (`/root/.cache/calamares/session.log`). Remove any personal information first.
      render: text
